<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title> hors ligne · Pass'Teny</title>
  <style>
    :root {
      --paper: #f7f1e4;
      --ink: #211b12;
      --ink-soft: #6a6252;
      --ink-faint: #a79d88;
      --red: #a63a2b;
      --red-dark: #7f2a1e;
      --green: #43633f;
      --mustard: #c4912e;
      --line: rgba(33, 27, 18, 0.13);
      --line-strong: rgba(33, 27, 18, 0.28);
      --card: #fffdf7;
      --shadow-soft: 0 1px 2px rgba(33, 27, 18, 0.05), 0 6px 18px -10px rgba(33, 27, 18, 0.16);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Lamba band */
    .lamba-band {
      height: 5px;
      width: 100%;
      background: repeating-linear-gradient(
        90deg,
        var(--red) 0 42px,
        var(--paper) 42px 58px,
        var(--green) 58px 100px,
        var(--mustard) 100px 124px,
        var(--ink) 124px 166px
      );
    }

    /* Diamond mark */
    .lamba-mark {
      display: inline-block;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      transform: rotate(45deg);
      border-radius: 3px;
      border: 1.5px solid var(--ink);
      background: conic-gradient(
        from 0deg,
        var(--red) 0 25%,
        var(--paper) 25% 50%,
        var(--green) 50% 75%,
        var(--mustard) 75% 100%
      );
      box-shadow: 0 1px 3px rgba(33, 27, 18, 0.18);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .icon-offline {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--card);
      border: 1.5px solid var(--line-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-soft);
      margin-bottom: 1.5rem;
    }

    .icon-offline svg {
      width: 32px;
      height: 32px;
      color: var(--ink-faint);
    }

    h1 {
      font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(1.5rem, 4vw, 2rem);
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .subtitle {
      margin-top: 0.75rem;
      font-size: 0.95rem;
      color: var(--ink-soft);
      max-width: 28rem;
      line-height: 1.6;
    }

    .hint {
      margin-top: 1.5rem;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--ink-faint);
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 0.72rem 1.5rem;
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      color: #fff;
      background: var(--red);
      border: 1px solid var(--red);
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .retry-btn:hover {
      background: var(--red-dark);
      border-color: var(--red-dark);
      transform: translateY(-1px);
    }

    .cached-pages {
      margin-top: 2.5rem;
      text-align: left;
      max-width: 20rem;
      width: 100%;
    }

    .cached-pages h2 {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--ink-faint);
      margin-bottom: 0.75rem;
    }

    .cached-pages a {
      display: block;
      padding: 0.6rem 0.85rem;
      margin-bottom: 0.35rem;
      border-radius: 6px;
      border: 1px solid var(--line-strong);
      background: var(--card);
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .cached-pages a:hover {
      border-color: var(--red);
      color: var(--red);
    }

    footer {
      padding: 1.25rem 1.5rem;
      text-align: center;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink-faint);
      border-top: 1px solid var(--line);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="lamba-band" aria-hidden="true"></div>

  <main>
    <div class="icon-offline">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
      </svg>
    </div>

    <h1>Vous êtes hors ligne</h1>
    <p class="subtitle">
      La connexion internet est indisponible. Les pages précédemment visitées
      restent accessibles ci-dessous.
    </p>

    <button class="retry-btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182" />
      </svg>
      Réessayer
    </button>

    <p class="hint">Pages disponibles hors ligne :</p>

    <nav class="cached-pages" id="cached-pages">
      <!-- Populated by JS -->
    </nav>
  </main>

  <footer>
    <span class="lamba-mark" aria-hidden="true" style="transform: rotate(45deg); width: 14px; height: 14px; vertical-align: middle; margin-right: 0.5rem;"></span>
    Pass'Teny · Ny hevitry ny teny
  </footer>

  <script>
    // List cached pages from the service worker
    async function listCachedPages() {
      const nav = document.getElementById('cached-pages');
      if (!nav || !('caches' in window)) {
        if (nav) nav.style.display = 'none';
        return;
      }

      try {
        const cache = await caches.open('passteny-pages-v1');
        const keys = await cache.keys();
        const pages = keys
          .map(req => new URL(req.url).pathname)
          .filter(p => p !== '/offline' && p !== '/')
          .sort();

        if (pages.length === 0) {
          nav.style.display = 'none';
          return;
        }

        const heading = nav.querySelector('h2');
        const fragment = document.createDocumentFragment();

        for (const page of pages) {
          const a = document.createElement('a');
          a.href = page;
          // Pretty-print the path
          a.textContent = page
            .replace(/^\/songs\//, '🎵 ')
            .replace(/^\/artists\//, '🎤 ')
            .replace(/^\/albums\//, '💿 ')
            .replace(/^\/glossary$/, '💬 Punchlines')
            .replace(/^\/chart$/, '📊 Chart')
            .replace(/^\/discover$/, '🧭 Découvrir')
            .replace(/^\/tags$/, '🏷️ Thématiques')
            .replace(/\//g, ' › ')
            .replace(/^› /, '');
          fragment.appendChild(a);
        }

        nav.appendChild(fragment);
      } catch {
        // SW not available
      }
    }

    listCachedPages();
  </script>
</body>
</html>
