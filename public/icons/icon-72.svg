<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <!-- Background -->
  <rect width="72" height="72" rx="12" fill="#f7f1e4"/>

  <!-- Lamba diamond — 4-color conic gradient (simulated with 4 paths) -->
  <g transform="translate(36, 36) rotate(45)">
    <!-- Top-left: red -->
    <path d="M0,-13.5 L-13.5,0 L0,13.5 Z" fill="#a63a2b"/>
    <!-- Top-right: paper -->
    <path d="M0,-13.5 L13.5,0 L0,13.5 Z" fill="#f7f1e4"/>
    <!-- Bottom-left: green -->
    <path d="M0,0 L-13.5,0 L0,13.5 Z" fill="#43633f"/>
    <!-- Bottom-right: mustard -->
    <path d="M0,0 L13.5,0 L0,13.5 Z" fill="#c4912e"/>

    <!-- Border -->
    <rect x="-13.5" y="-13.5"
          width="27" height="27"
          rx="3" fill="none" stroke="#211b12" stroke-width="1.08"/>
  </g>

  <!-- Text label below the diamond -->
  <text x="36" y="67.45"
        font-family="system-ui, -apple-system, sans-serif"
        font-weight="700"
        font-size="9"
        text-anchor="middle"
        fill="#211b12"
        letter-spacing="-0.02em">PASS'TENY</text>
</svg>