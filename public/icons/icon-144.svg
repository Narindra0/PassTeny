<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <!-- Background -->
  <rect width="144" height="144" rx="23" fill="#f7f1e4"/>

  <!-- Lamba diamond — 4-color conic gradient (simulated with 4 paths) -->
  <g transform="translate(72, 72) rotate(45)">
    <!-- Top-left: red -->
    <path d="M0,-27.5 L-27.5,0 L0,27.5 Z" fill="#a63a2b"/>
    <!-- Top-right: paper -->
    <path d="M0,-27.5 L27.5,0 L0,27.5 Z" fill="#f7f1e4"/>
    <!-- Bottom-left: green -->
    <path d="M0,0 L-27.5,0 L0,27.5 Z" fill="#43633f"/>
    <!-- Bottom-right: mustard -->
    <path d="M0,0 L27.5,0 L0,27.5 Z" fill="#c4912e"/>

    <!-- Border -->
    <rect x="-27.5" y="-27.5"
          width="55" height="55"
          rx="3" fill="none" stroke="#211b12" stroke-width="2.16"/>
  </g>

  <!-- Text label below the diamond -->
  <text x="72" y="134.9"
        font-family="system-ui, -apple-system, sans-serif"
        font-weight="700"
        font-size="17"
        text-anchor="middle"
        fill="#211b12"
        letter-spacing="-0.02em">PASS'TENY</text>
</svg>