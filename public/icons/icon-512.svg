<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="82" fill="#f7f1e4"/>

  <!-- Lamba diamond — 4-color conic gradient (simulated with 4 paths) -->
  <g transform="translate(256, 256) rotate(45)">
    <!-- Top-left: red -->
    <path d="M0,-97.5 L-97.5,0 L0,97.5 Z" fill="#a63a2b"/>
    <!-- Top-right: paper -->
    <path d="M0,-97.5 L97.5,0 L0,97.5 Z" fill="#f7f1e4"/>
    <!-- Bottom-left: green -->
    <path d="M0,0 L-97.5,0 L0,97.5 Z" fill="#43633f"/>
    <!-- Bottom-right: mustard -->
    <path d="M0,0 L97.5,0 L0,97.5 Z" fill="#c4912e"/>

    <!-- Border -->
    <rect x="-97.5" y="-97.5"
          width="195" height="195"
          rx="3" fill="none" stroke="#211b12" stroke-width="7.68"/>
  </g>

  <!-- Text label below the diamond -->
  <text x="256" y="479.8"
        font-family="system-ui, -apple-system, sans-serif"
        font-weight="700"
        font-size="61"
        text-anchor="middle"
        fill="#211b12"
        letter-spacing="-0.02em">PASS'TENY</text>
</svg>